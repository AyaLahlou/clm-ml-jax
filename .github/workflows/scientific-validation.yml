name: Scientific validation

on:
  pull_request:
    branches: [main, reference/fortran-parity]
  push:
    branches: [main, reference/fortran-parity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "1"
  PYTHONPATH: src

jobs:
  jax-regression:
    name: JAX CPU regression
    if: github.base_ref != 'reference/fortran-parity' && github.ref_name != 'reference/fortran-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements/validation-cpu.txt
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements/validation-cpu.txt
      - name: Run legacy JAX regression cases
        if: hashFiles('tests/clm_src_utils/test_clm_varorb.py') != ''
        run: |
          python -m pytest -q --tb=short \
            tests/clm_src_utils/test_clm_varorb.py \
            tests/multilayer_canopy/test_MLLeafHeatCapacityMod.py \
            tests/multilayer_canopy/test_MLclm_varcon.py \
            tests/multilayer_canopy/test_MLclm_varpar.py
      - name: Check validation coverage for current layout
        if: hashFiles('tests/clm_src_utils/test_clm_varorb.py') == ''
        run: |
          test -f tests/fortran_validation/test_golden_jax.py
          echo "Current layout uses the golden regression job." >> "$GITHUB_STEP_SUMMARY"

  fortran-goldens:
    name: Fortran golden-case regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Locate the golden-case suite
        id: goldens
        env:
          REFERENCE_TRACK: ${{ github.base_ref == 'reference/fortran-parity' || github.ref_name == 'reference/fortran-parity' }}
        run: |
          if [[ -f tests/fortran_validation/test_golden_jax.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REFERENCE_TRACK" == "true" ]]; then
            echo "::error::Reference track is missing the required Fortran golden-case suite."
            exit 1
          else
            echo "Fortran golden-case coverage is unavailable on this checkout." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.goldens.outputs.present == 'true'
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: requirements/validation-cpu.txt
      - name: Install pinned validation dependencies
        if: steps.goldens.outputs.present == 'true'
        run: |
          python -m pip install --only-binary=:all: -r requirements/validation-cpu.txt
      - name: Check and compare Fortran golden cases
        if: steps.goldens.outputs.present == 'true'
        run: |
          if [[ ! -d tests/fortran_validation/golden_IO && ! -d clm-ml-fortran/golden_IO ]]; then
            fixture_commit=fe4a5563fec7eacaba86537e82157f866917dfd8
            git fetch --no-tags --depth=1 https://github.com/AyaLahlou/clm-ml-jax.git "$fixture_commit"
            test "$(git rev-parse "${fixture_commit}:tests/fortran_validation/golden_IO")" \
              = 9fa22331dc09542c636a1ac61b3eb3e8edcbf854
            mkdir -p clm-ml-fortran/golden_IO
            git archive "${fixture_commit}:tests/fortran_validation/golden_IO" \
              | tar -xf - -C clm-ml-fortran/golden_IO
          fi
          python -m pytest -q --tb=short tests/fortran_validation \
            --junitxml="$RUNNER_TEMP/fortran-goldens.xml"
          python - "$RUNNER_TEMP/fortran-goldens.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall(".//testcase")
          skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
          if len(cases) < 160 or skipped:
              raise SystemExit(
                  f"Expected at least 160 golden cases with zero skips. Cases: {len(cases)}. Skipped: {skipped}"
              )
          PY
      - name: Check the production dry-canopy equation
        if: steps.goldens.outputs.present == 'true' && hashFiles('tests/test_canopy_wetted_fraction.py') != ''
        run: python -m pytest -q --tb=short tests/test_canopy_wetted_fraction.py
